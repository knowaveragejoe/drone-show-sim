# Dependabot opens a pull request when an action of the CI workflow has a new version. The
# project has no npm dependencies, so GitHub Actions is the only ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all the actions at once.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: CI
