<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone show simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="view" aria-label="3D view of the drone show"></canvas>
    <p id="fatal" role="alert" hidden></p>
  </main>

  <aside id="sidebar">
    <h1>Drone show simulator</h1>

    <details open>
      <summary>Fleet</summary>
      <div class="section">
        <div class="fields" id="fleet-fields"></div>
      </div>
    </details>

    <details open>
      <summary>Formation</summary>
      <div class="section">
        <div class="field">
          <label for="shape">Shape</label>
          <select id="shape"></select>
        </div>
        <div class="fields" id="formation-fields"></div>
        <div class="field">
          <label for="color">Color</label>
          <input id="color" type="color">
        </div>
        <div class="field">
          <span class="label">Closest spacing</span>
          <span class="readout-with-button">
            <output id="spacing"></output>
            <button id="fit" type="button" title="Set the smallest size that keeps the minimum spacing">Fit</button>
          </span>
        </div>
      </div>
    </details>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
